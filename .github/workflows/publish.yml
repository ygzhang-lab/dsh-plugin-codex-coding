name: Publish

# Manual only. A normal push, merge, or tag never builds or publishes the
# package; publishing starts when a maintainer runs this workflow from the
# Actions tab (or `gh workflow run publish.yml`).
on:
  workflow_dispatch:
    inputs:
      dist_tag:
        description: npm dist-tag to publish under
        type: choice
        options:
          - latest
          - next
          - beta
        default: latest
      dry_run:
        description: Run the checks and skip the real publish
        type: boolean
        default: true

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    # Publish only from the default branch, never from a stale feature ref.
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12.16.1

      - uses: actions/setup-node@v4
        with:
          node-version: 24.9.0
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - run: pnpm test

      - run: pnpm build

      - name: Show the version that would publish
        run: |
          node -e 'const p=require("./package.json"); console.log(`${p.name}@${p.version}`)'

      - name: Skip an already published version
        id: published
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          NAME=$(node -p 'require("./package.json").name')
          VERSION=$(node -p 'require("./package.json").version')
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "$NAME@$VERSION is already on npm; nothing to publish."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish dry run
        if: inputs.dry_run && steps.published.outputs.exists == 'false'
        run: npm publish --dry-run --tag "${{ inputs.dist_tag }}"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish
        if: ${{ !inputs.dry_run && steps.published.outputs.exists == 'false' }}
        run: npm publish --access public --provenance --tag "${{ inputs.dist_tag }}"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
