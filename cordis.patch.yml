# dsh-plugin-codex-coding bundle: one passive Host settings service plus the Coding preset.
#
# The Host row only owns settings and the Web configuration page. All agent
# behavior—prompt, tools, skills, reasoning policy—is mounted by the Coding
# preset, so simply installing this bundle changes no existing session.
- insert:
    - id: dsh-plugin-codex-coding
      name: "dsh-plugin-codex-coding"
      config:
        reasoning: auto
        localSkills: true
        # auto follows the DSH interface locale, then the host locale; only
        # zh and en ship. The prompt keeps replies and todo items in it.
        language: auto
        disabledPlugins: []

    - id: preset-codex-coding
      name: "@deepseek-ai/dsh-agent-preset"
      config:
        id: coding
        name: "Codex Coding"
        description: >-
          DSH Codex 风格 Coding 插件：先检查、用 todo 规划、小步修改、运行最窄验证并简洁汇报。
          A Codex-style coding agent for DSH: inspect first, plan with a todo list,
          make surgical changes, run the narrowest verification, and report concisely.
        order: 5
        plugins:
          - id: persona
            name: "@deepseek-ai/dsh-persona"
            config:
              prefix: |-
                You are Codex, a pragmatic senior software engineer working as a coding agent inside the DeepSeek Harness (DSH). {{model}} is the model behind you; DSH supplies the workspace, the tools, the skills, and this session. You are not a general chat assistant — you are the engineer assigned to this repository.

                What you optimize for:
                - Ground truth over recall. Inspect the real files, run the real command, read the real error before deciding. Never claim a check you did not run, a file you did not read, or a result you did not see.
                - The smallest correct change. Reuse existing patterns and functions; add no abstraction, dependency, or drive-by refactor the task does not need.
                - A user who is better informed after every turn. Say plainly what you did, what you found, what you could not verify, and what you need next.

                How you show up:
                - Direct, concrete, calm. No flattery, no filler, no self-narration, and no replay of your own tool calls.
                - Short sentences with real paths, real commands, and real file:line references instead of pasted walls of text.
                - Quick to admit a mistake, a dead end, or a missing capability rather than improvising around it.
                - When asked who you are, answer with the role and what you optimize for. Do not recite the runtime context, and never include the GUI URL.

                Precedence and scope: an explicit instruction from the user outranks repository conventions (AGENTS.md and local patterns), which outrank your own defaults. The runtime context below is the authoritative description of this environment and wins over any assumption. The operating contract that follows owns workflow modes, tool use, verification, and delivery — follow it as written instead of inventing a parallel process or restating it.
              includeRuntimeContext: true
              # The full operating contract, task playbooks, and delivery rules
              # are registered as the `coding:contract` system-prompt section by
              # dsh-plugin-codex-coding/preset. Keeping identity, temperament, and
              # precedence here and workflow there avoids two competing prompts
              # that drift apart.

          - id: agent-instructions
            name: "@deepseek-ai/dsh-agent-instructions"
            config:
              maxBytes: 65536

          - id: tool-bash
            name: "@deepseek-ai/dsh-tool-bash"
            disabled: !!js process.platform === 'win32'
          - id: tool-pwsh
            name: "@deepseek-ai/dsh-tool-pwsh"
            disabled: !!js process.platform !== 'win32'
          - id: tool-fs
            name: "@deepseek-ai/dsh-tool-fs"
          - id: tool-fs-search
            name: "@deepseek-ai/dsh-tool-fs-search"
            config:
              sampleOverCapGlobResults: false
          - id: tool-jobs
            name: "@deepseek-ai/dsh-tool-jobs"
          - id: tool-todo
            name: "@deepseek-ai/dsh-tool-todo"
            config:
              allowParallelInProgress: false
          - id: tool-web
            name: "@deepseek-ai/dsh-tool-web"
            config:
              fetch: true
              searchTimeoutMs: 60000

          # Local skills are always composed; the settings policy hides the
          # skill tool (and therefore retires the catalog) when disabled.
          - id: skill-filesystem
            name: "@deepseek-ai/dsh-skill-filesystem"
          - id: tool-skill
            name: "@deepseek-ai/dsh-tool-skill"

          - id: dsh-plugin-codex-coding-preset
            name: "dsh-plugin-codex-coding/preset"

          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: "@deepseek-ai/dsh-compaction-basic"
                config:
                  auto: false
              - id: command-compact
                name: "@deepseek-ai/dsh-command-compact"
              - id: tool-result-pruner
                name: "@deepseek-ai/dsh-compaction-tool-result-pruner"
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
